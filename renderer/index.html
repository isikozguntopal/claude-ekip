<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Claude Ekip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand"><canvas id="brandIcon" width="32" height="32"></canvas><span>CLAUDE EKİP</span></div>
      <div class="acct-wrap">
        <button id="acctBtn" class="acct-btn" title="Bu uygulamanın Claude hesabı">
          <span class="acct-dot"></span>
          <span id="acctName" class="acct-name">…</span>
          <span class="caret">▾</span>
        </button>
        <div id="acctMenu" class="menu hidden"></div>
      </div>
    </div>
    <div class="ws-wrap">
      <button id="wsBtn" class="ws-btn" title="Workspace seç">
        <span class="ws-label">WORKSPACE</span>
        <span id="wsPath" class="ws-path">Seçilmedi</span>
        <span class="caret">▾</span>
      </button>
      <div id="wsMenu" class="menu hidden"></div>
    </div>
    <div class="spacer"></div>
    <div id="limits" class="limits" title="Plan kullanım limitleri"></div>
    <label class="mode">
      <span>Model</span>
      <select id="model">
        <option value="claude-sonnet-5-5">Sonnet 5.5 · fiyat/performans</option>
        <option value="claude-opus-5-5">Opus 5.5 · en güçlü (2× limit)</option>
        <option value="claude-haiku-5-5">Haiku 5.5 · basit işler</option>
      </select>
    </label>
    <label class="mode">
      <span>İzin</span>
      <select id="mode">
        <option value="default">Her adımda sor</option>
        <option value="acceptEdits">Düzenlemeleri otomatik onayla</option>
        <option value="plan">Sadece planla (değişiklik yok)</option>
        <option value="bypassPermissions">Hiç sorma (riskli)</option>
      </select>
    </label>
    <span id="state" class="chip chip-off">Oturum yok</span>
    <button id="pvToggle" class="btn" title="Tarayıcı ve iOS Simulator önizlemesi">Önizleme</button>
    <button id="newSession" class="btn">Yeni oturum</button>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main>
    <section class="left">
      <div class="panel office-panel">
        <div class="panel-head">
          <h2>OFİS</h2>
          <button id="installAll" class="btn btn-small hidden">Eksik ekibi kur</button>
        </div>
        <div id="office" class="office"></div>
      </div>
      <div id="detail" class="panel detail"></div>
    </section>

    <section class="panel chat">
      <div id="log" class="log"></div>
      <div id="slashMenu" class="slash hidden"></div>
      <div class="composer">
        <div id="leadHint" class="lead-hint"></div>
        <textarea id="input" rows="3" placeholder="Ekibe bir iş verin…  (Enter: gönder · Shift+Enter: yeni satır · / ile komutlar)"></textarea>
        <div class="composer-actions">
          <button id="stop" class="btn btn-danger" disabled>Durdur</button>
          <button id="send" class="btn btn-primary">Gönder</button>
        </div>
      </div>
    </section>
        <aside class="panel preview">
          <div class="panel-head">
            <div class="pv-tabs">
              <button class="pv-tab active" data-pv="web">Tarayıcı</button>
              <button class="pv-tab" data-pv="sim">iOS Simulator</button>
            </div>
          </div>
          <div id="pvWeb" class="pv-body">
            <form id="urlForm" class="pv-bar">
              <input id="urlInput" value="http://localhost:8888" spellcheck="false" />
              <button class="btn btn-small" type="submit">Git</button>
            </form>
            <webview id="webview" class="pv-frame" src="about:blank"></webview>
          </div>
          <div id="pvSim" class="pv-body hidden">
            <div class="pv-bar">
              <select id="simDevice"></select>
              <button id="simBoot" class="btn btn-small">Aç</button>
            </div>
            <div class="pv-frame sim-screen">
              <img id="simShot" alt="" class="hidden" />
              <p id="simMsg" class="pv-msg">Bir simülatör seçip Aç'a basın.</p>
            </div>
          </div>
        </aside>
  </main>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="../team.js"></script>
  <script src="markdown.js"></script>
  <script src="preview.js"></script>
  <script src="app.js"></script>
</body>
</html>
